<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ページが見つかりません / Page not found</title>
    <meta name="robots" content="noindex">
    <style>
      :root { color-scheme: light dark; --bg: #f3f5f6; --ink: #141d26; --muted: #5b6a77; --accent: #8f6a1c; --gold: #d9b24c; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0b1016; --ink: #e8edf0; --muted: #8e9ba6; --accent: #d9b24c; } }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; background: var(--bg); color: var(--ink); font: 16px/1.8 "Hiragino Sans", "Noto Sans JP", sans-serif; text-align: center; }
      h1 { word-break: keep-all; margin: 0 0 8px; font: 800 clamp(26px, 6vw, 34px)/1.4 "Hiragino Mincho ProN", "Shippori Mincho B1", serif; letter-spacing: .08em; }
      p { margin: 0; color: var(--muted); }
      .cut { display: block; width: min(240px, 60vw); height: 2px; margin: 22px auto; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
      a { color: var(--accent); font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>ページが<wbr>見つかりません</h1>
      <span class="cut"></span>
      <p>このサイトは、くとはな（<a href="https://kutohana.com/">kutohana.com</a>）に移りました。</p>
      <p lang="en">This site has moved to <a href="https://kutohana.com/">kutohana.com</a>.</p>
    </main>
  </body>
</html>
