<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#f2eee3">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>404 — KUTO</title>
    <style>
      * { box-sizing: border-box; }
      :root { color: #1b1a17; background: #f2eee3; font-family: "Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", sans-serif; }
      body { position: relative; min-height: 100svh; margin: 0; overflow-x: hidden; background: #f2eee3; }
      body::before { position: fixed; z-index: 0; top: 50%; right: -10vw; width: clamp(760px,72vw,1120px); aspect-ratio: 3/2; content: ""; background: url('/particle-87.png') center/contain no-repeat; opacity: .26; transform: translateY(-50%); }
      header, main { position: relative; z-index: 1; width: min(calc(100% - 96px), 1280px); margin-inline: auto; }
      header { display: flex; min-height: 92px; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(27,26,23,.26); font-size: .78rem; font-weight: 700; }
      header strong { font-size: 1.35rem; letter-spacing: -.06em; }
      header sup { margin-left: 2px; color: #b94332; font-size: .45em; vertical-align: super; }
      main { display: flex; min-height: calc(100svh - 92px); flex-direction: column; justify-content: center; padding-block: 80px; }
      .code { margin: 0 0 24px; color: #b94332; font-size: .78rem; font-weight: 700; }
      h1 { max-width: 9em; margin: 0; font-size: clamp(3.75rem, 7vw, 6.5rem); font-weight: 500; letter-spacing: -.045em; line-height: 1.05; }
      p { max-width: 520px; margin: 48px 0 0; color: #4f504c; font-size: 1rem; line-height: 1.9; }
      a { display: inline-flex; width: min(100%, 230px); min-height: 50px; align-items: center; justify-content: space-between; margin-top: 40px; border-bottom: 1px solid #1b1a17; color: #1b1a17; font-size: .86rem; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #b94332; outline-offset: 4px; }
      @media (max-width: 620px) { body::before { top: 34%; right: -54vw; width: 138vw; opacity: .22; } header, main { width: calc(100% - 32px); } header { min-height: 74px; } main { min-height: calc(100svh - 74px); } h1 { font-size: clamp(2.9rem, 13vw, 4rem); } p { margin-top: 36px; } }
      @media (forced-colors: active) { body::before { display: none; } }
    </style>
  </head>
  <body>
    <header><strong>KUTO<sup>87</sup></strong><span>Page not found</span></header>
    <main>
      <p class="code">404</p>
      <h1>ページが<br>見つかりません。</h1>
      <p>URLが変わったか、ページが削除されています。トップページから公開中のゲームやツールを開けます。</p>
      <a href="/">トップへ <span aria-hidden="true">→</span></a>
    </main>
  </body>
</html>
