<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#e8e0cf">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>404 — KUTO</title>
    <style>
      * { box-sizing: border-box; }
      :root { color: #16252d; background: #e8e0cf; font-family: Inter, "Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", sans-serif; }
      body { min-height: 100svh; margin: 0; padding: 24px; display: grid; place-items: center; background-image: linear-gradient(rgba(49,95,113,.14) 1px, transparent 1px), linear-gradient(90deg, rgba(49,95,113,.14) 1px, transparent 1px); background-size: 24px 24px; }
      main { width: min(100%, 920px); border: 2px solid #16252d; background: rgba(247,241,228,.94); }
      .top { display: flex; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid #16252d; color: #a83c2e; font: 800 12px/1 ui-monospace, monospace; letter-spacing: .1em; }
      .body { display: grid; grid-template-columns: .85fr 1.15fr; min-height: 430px; }
      .number { display: grid; place-items: center; border-right: 1px solid #16252d; color: #a83c2e; background-image: linear-gradient(rgba(49,95,113,.14) 1px, transparent 1px), linear-gradient(90deg, rgba(49,95,113,.14) 1px, transparent 1px); background-size: 24px 24px; font-family: Georgia, "Yu Mincho", serif; font-size: clamp(7rem, 22vw, 14rem); font-weight: 700; letter-spacing: -.12em; line-height: .8; }
      .copy { display: flex; flex-direction: column; justify-content: center; padding: clamp(34px, 7vw, 72px); }
      h1 { margin: 0; font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: clamp(2.4rem, 6vw, 5.2rem); font-weight: 600; letter-spacing: -.07em; line-height: 1.08; text-wrap: balance; }
      p { margin: 24px 0 0; color: #45545a; line-height: 1.9; text-wrap: pretty; }
      a { display: inline-flex; width: fit-content; min-height: 50px; align-items: center; gap: 28px; margin-top: 34px; padding: 0 18px; border: 1px solid #16252d; color: #f7f1e4; background: #a83c2e; font-weight: 800; text-decoration: none; }
      a:focus-visible { outline: 3px solid #a83c2e; outline-offset: 4px; }
      @media (max-width: 650px) { body { padding: 12px; } .body { grid-template-columns: 1fr; } .number { min-height: 200px; border-right: 0; border-bottom: 1px solid #16252d; } .copy { padding: 32px 24px 38px; } h1 { font-size: clamp(2.25rem, 12vw, 3.5rem); } }
    </style>
  </head>
  <body>
    <main>
      <div class="top"><span>KUTO / 87</span><span>NOT FOUND</span></div>
      <div class="body">
        <div class="number" aria-hidden="true">404</div>
        <div class="copy">
          <h1>ここには、<br>記録がありません。</h1>
          <p>URLが変わったか、ページが見つからないようです。公式サイトのトップから、公開中の作品をご覧ください。</p>
          <a href="/">トップへ戻る <span aria-hidden="true">→</span></a>
        </div>
      </div>
    </main>
  </body>
</html>
